services:
  app-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ADO_ORG=${ADO_ORG}
      - ADO_PROJECT=${ADO_PROJECT}
      - ADO_PAT=${ADO_PAT}
    restart: unless-stopped
    profiles:
      - prod
